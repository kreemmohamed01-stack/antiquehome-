<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>All Products — Antique Home</title>
<meta name="description" content="Browse our full collection of curated vases, antiques, lighting and home décor — timeless pieces for every room." />
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
<link rel="canonical" href="https://www.antiqueehome.com/shop.html" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Antique Home" />
<meta property="og:title" content="All Products — Antique Home" />
<meta property="og:description" content="Browse our full collection of curated vases, antiques, lighting and home décor — timeless pieces for every room." />
<meta property="og:url" content="https://www.antiqueehome.com/shop.html" />
<meta property="og:image" content="https://www.antiqueehome.com/og-logo-v2.png" />
<meta property="og:image:alt" content="Antique Home — Vase &amp; Decor" />
<meta property="og:locale" content="en_US" />
<meta property="og:locale:alternate" content="ar_EG" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="All Products — Antique Home" />
<meta name="twitter:description" content="Browse our full collection of curated vases, antiques, lighting and home décor — timeless pieces for every room." />
<meta name="twitter:image" content="https://www.antiqueehome.com/og-logo-v2.png" />
<link rel="preconnect" href="https://res.cloudinary.com" />
<link rel="preload" as="fetch" href="/api/settings?key=public" crossorigin="anonymous" />
<link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-core.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-italic-core.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="/fonts/jost-core.woff2" crossorigin />
<!-- Self-hosted fonts (same-origin, cached a year). Each family has a small
     "-core" file (basic Latin, what the site's own text uses) that is preloaded,
     and the full Latin file, only downloaded if a rarer accented character
     appears on the page (unicode-range). -->
<link rel="stylesheet" href="/css/fonts.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/shop.css" />
<script src="/js/i18n.js"></script>
<!-- Arabic dictionary: only downloaded for Arabic visitors (js/i18n.js
     fetches it on demand if someone switches language). -->
<meta name="ah-dict" data-src="/js/i18n-dictionary.js" />
<script>try{if(localStorage.getItem("ah_lang")==="ar")document.write('<script src="'+document.querySelector('meta[name=ah-dict]').getAttribute("data-src")+'"><\/script>')}catch(e){}</script>
<script src="/js/seo.js"></script>
<!-- The banner + category rail are built by js/shop.js at the end of the
     page; until then the grid/footer stay hidden, so they don't visibly
     jump down when the banner appears (3s safety net if JS fails). -->
<style>.shop-pending .shop, .shop-pending #chromeSlot, .shop-pending .foot{ visibility:hidden; }</style>
<script>
  // "All products" hero: start fetching its photo now, not after shop.js builds it.
  if (!new URLSearchParams(location.search).get("category")) {
    [["(min-width: 900px)", "/images/shop/hero-desktop.webp"], ["(max-width: 899px)", "/images/shop/hero-mobile.webp"]].forEach(function (x) {
      var l = document.createElement("link"); l.rel = "preload"; l.as = "image"; l.media = x[0]; l.href = x[1]; l.setAttribute("fetchpriority", "high"); document.head.appendChild(l);
    });
  }
</script>
<script>document.documentElement.classList.add("shop-pending");setTimeout(function(){document.documentElement.classList.remove("shop-pending")},3000);</script>
<script type="speculationrules">{"prefetch":[{"where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":["/admin/*","/api/*","/checkout.html","/order-confirmation.html*"]}}]},"eagerness":"moderate"}]}</script>
</head>
<body>
<!-- page-loader: only for a slow page. If the page is still parsing 900ms
     after the click, a white screen with "Loading" in the brand serif fades
     in; a gold copy of the word fills left to right (with a hairline under
     it) and it fades out on window "load" (5s cap). A page that is already
     showing never gets covered, so fast loads (and page-speed scores) are
     untouched. The brand intro (index) sits above it. -->
<div id="pageLoader" class="pl" hidden role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="pl__word" aria-hidden="true">
    <span class="pl__base">Loading</span>
    <span class="pl__fill" id="plFill">Loading</span>
  </div>
  <span class="pl__line" aria-hidden="true"><i id="plLine"></i></span>
</div>
<link rel="stylesheet" href="/css/page-loader.css" />
<script src="/js/page-loader.js" data-inline></script>
<!-- /page-loader -->

<div id="shopHeroSlot"><script>
  // "All products": paint the hero photo straight from the HTML instead of
  // waiting for js/shop.js, which rebuilds the full banner around it (the
  // photo is cached by then, so nothing flickers).
  if (!new URLSearchParams(location.search).get("category")) document.write('<section class="shop-hero"><div class="shop-hero__media" aria-hidden="true"><picture><source media="(min-width: 900px)" srcset="/images/shop/hero-desktop.webp" /><img src="/images/shop/hero-mobile.webp" alt="" fetchpriority="high" /></picture><div class="shop-hero__tint"></div></div></section>');
</script></div>

<div id="catRailSlot"></div>

<main class="shop">
  <div class="shop-toolbar">
    <div class="shop-toolbar__row">
      <button class="tool-btn tool-btn--filter" type="button" id="filterToggle" aria-expanded="false" aria-controls="shopFiltersAside">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><circle cx="9" cy="7" r="2.2"></circle><line x1="4" y1="17" x2="20" y2="17"></line><circle cx="15" cy="17" r="2.2"></circle></svg>
        <span data-i18n="filter">Filter</span>
      </button>
    </div>
    <div class="shop-toolbar__meta">
      <span id="shopCount">0 Products</span>
      <div class="sort-pop" id="sortPop" data-open="false">
        <button class="tool-btn tool-btn--sort" type="button" id="sortToggle" aria-expanded="false">
          <span class="js-sort-label" id="sortLabel">Sort By: Newest</span>
          <svg class="tool-btn__chev" viewBox="0 0 12 8" aria-hidden="true"><polyline points="1,1.5 6,6.5 11,1.5"></polyline></svg>
        </button>
        <div class="sort-pop__list" id="sortList">
          <button type="button" data-sort="newest" class="is-active" data-i18n="sortNewest">Newest</button>
          <button type="button" data-sort="price-asc" data-i18n="sortPriceAsc">Price: Low to High</button>
          <button type="button" data-sort="price-desc" data-i18n="sortPriceDesc">Price: High to Low</button>
          <button type="button" data-sort="name-asc" data-i18n="sortNameAsc">Name: A&ndash;Z</button>
        </div>
      </div>
      <div class="view-toggle" id="viewToggle">
        <button type="button" class="is-active" data-view="grid" aria-label="Grid view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8"></rect><rect x="13" y="3" width="8" height="8"></rect><rect x="3" y="13" width="8" height="8"></rect><rect x="13" y="13" width="8" height="8"></rect></svg>
        </button>
        <button type="button" data-view="list" aria-label="List view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="shop-body">
    <div class="filters__scrim" id="filtersScrim"></div>
    <aside class="filters" aria-label="Filters" id="shopFiltersAside">
      <div class="filters__closeBtn">
        <span data-i18n="filter">Filters</span>
        <button type="button" id="filterClose" aria-label="Close filters">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4.6" y1="4.6" x2="19.4" y2="19.4"></line><line x1="19.4" y1="4.6" x2="4.6" y2="19.4"></line></svg>
        </button>
      </div>
      <div class="filters__group">
        <h2 class="filters__title" data-i18n="category">Category</h2>
        <ul class="filters__cats" id="filterCats"></ul>
      </div>

      <div class="filters__group filters__price">
        <h2 class="filters__title" data-i18n="price">Price</h2>
        <input type="range" class="filters__range" id="priceRange" min="500" max="20000" step="100" value="20000" aria-label="Maximum price" />
        <div class="filters__price-labels">
          <span>EGP 0</span>
          <span class="js-price-max" id="priceMaxLabel">EGP 20,000+</span>
        </div>
      </div>

      <div class="filters__group">
        <h2 class="filters__title" data-i18n="color">Color</h2>
        <div class="filters__swatches" id="colorSwatches">
          <button type="button" class="filters__swatch" style="background:#D9C8AC" aria-pressed="false" aria-label="beige" data-color="beige"></button>
          <button type="button" class="filters__swatch" style="background:#6B4A32" aria-pressed="false" aria-label="brown" data-color="brown"></button>
          <button type="button" class="filters__swatch" style="background:#1C1611" aria-pressed="false" aria-label="black" data-color="black"></button>
          <button type="button" class="filters__swatch" style="background:#5C6B4A" aria-pressed="false" aria-label="green" data-color="green"></button>
          <button type="button" class="filters__swatch" style="background:#F6F1E8" aria-pressed="false" aria-label="white" data-color="white"></button>
        </div>
      </div>

      <div class="filters__group">
        <h2 class="filters__title" data-i18n="material">Material</h2>
        <div class="filters__check" id="materialChecks">
          <label><input type="checkbox" value="ceramic" /><span data-i18n="materialCeramic">Ceramic</span></label>
          <label><input type="checkbox" value="glass" /><span data-i18n="materialGlass">Glass</span></label>
          <label><input type="checkbox" value="metal" /><span data-i18n="materialMetal">Metal</span></label>
          <label><input type="checkbox" value="wood" /><span data-i18n="materialWood">Wood</span></label>
          <label><input type="checkbox" value="marble" /><span data-i18n="materialMarble">Marble</span></label>
          <label><input type="checkbox" value="stone" /><span data-i18n="materialStone">Stone</span></label>
          <label><input type="checkbox" value="fabric" /><span data-i18n="materialFabric">Fabric</span></label>
        </div>
      </div>

      <button type="button" class="filters__clear js-clear-filters" id="clearFilters" data-i18n="clearFilters">Clear Filters</button>
    </aside>

    <div>
      <div class="shop-grid" id="shopGrid">
        <p style="padding:40px 0;opacity:.7;grid-column:1/-1">Loading products&hellip;</p>
      </div>

      <nav class="pager" id="pager" aria-label="Pagination" style="display:none"></nav>
    </div>
  </div>
</main>

<div id="chromeSlot"></div>

<script src="/js/api.js"></script>
<script src="/js/chrome-partials.js"></script>
<script src="/js/site-chrome.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
