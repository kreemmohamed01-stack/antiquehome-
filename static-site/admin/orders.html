<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<title>Orders — Antique Home Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/admin/admin.css">
<link rel="stylesheet" href="/css/admin/admin-v3.css">
<link rel="stylesheet" href="/css/admin/admin-fx.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/admin/admin-luxe.css">
</head>
<body>
<div class="admin" id="admin-root">
  <div class="admin__pageHead">
    <img src="/images/home/section-2-main.webp" alt="">
    <div class="admin__pageHead-body">
      <p class="admin__crumb"><a href="/admin/index.html">Dashboard</a><span>Orders</span></p>
      <h1 class="admin__pageTitle">Orders</h1>
      <p class="admin__pageSub">Track and manage every order.</p>
    </div>
  </div>

  <div class="admin__statStrip admin__statStrip--6" id="statStrip"></div>

  <div class="admin__panel">
    <div class="admin__tabRow" id="tabRow" style="margin-bottom:14px"></div>
    <div class="admin__toolbar">
      <div class="admin__searchInline">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"></circle><line x1="15.7" y1="15.7" x2="20.2" y2="20.2"></line></svg>
        <input type="text" id="searchInput" placeholder="Search orders…">
      </div>
    </div>
    <div id="ordersList"></div>
    <div class="admin__pager" id="pager" style="display:none"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin/admin-shell.js"></script>
<script src="/js/admin/pages/orders.js"></script>
<script src="/js/admin/admin-luxe.js"></script>
</body>
</html>
