<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<title>Categories — Antique Home Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/admin/admin.css">
<link rel="stylesheet" href="/css/admin/admin-v3.css">
<link rel="stylesheet" href="/css/admin/admin-fx.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/admin/admin-luxe.css">
</head>
<body>
<div class="admin" id="admin-root">
  <div class="admin__pageHead">
    <div class="admin__pageHead-body">
      <p class="admin__crumb"><a href="/admin/index.html">Dashboard</a><span>Categories</span></p>
      <h1 class="admin__pageTitle">Categories</h1>
      <p class="admin__pageSub">Organize how products are grouped on the storefront.</p>
    </div>
    <button type="button" class="admin__btn admin__btn--gold" id="addCatBtn">+ Add Category</button>
  </div>

  <div class="admin__panel">
    <div id="catList"></div>
  </div>
</div>

<!-- Category form modal — same overlay pattern as the Edit Product modal. -->
<div class="admin" id="catModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;overflow:auto">
  <div style="max-width:640px;margin:20px auto 60px;background:var(--a-panel);border:1px solid var(--a-border);border-radius:0;padding:28px;color:var(--a-text)" id="catModalBody"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin/admin-shell.js"></script>
<script src="/js/admin/pages/categories.js"></script>
<script src="/js/admin/admin-luxe.js"></script>
</body>
</html>
