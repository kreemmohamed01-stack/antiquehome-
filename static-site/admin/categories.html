<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories — Antique Home Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/admin-v3.css">
</head>
<body>
<div class="admin" id="admin-root">
  <div class="admin__pageHead">
    <div class="admin__pageHead-body">
      <p class="admin__crumb"><a href="/admin/index.html">Dashboard</a><span>Categories</span></p>
      <h1 class="admin__pageTitle">Categories</h1>
      <p class="admin__pageSub">Organize how products are grouped on the storefront.</p>
    </div>
    <button type="button" class="admin__btn admin__btn--gold" id="addCatBtn">+ Add Category</button>
  </div>

  <div class="admin__panel">
    <div id="catList"></div>
  </div>
</div>

<!-- Category form modal — same overlay pattern as the Edit Product modal. -->
<div class="admin" id="catModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;overflow:auto">
  <div style="max-width:640px;margin:20px auto 60px;background:var(--a-panel);border:1px solid var(--a-border);border-radius:0;padding:28px;color:var(--a-text)" id="catModalBody"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin-shell.js"></script>
<script>
  let ALL_PRODUCTS = [];

  async function load() {
    const cats = await API.get("/api/categories");
    document.getElementById("catList").innerHTML = cats.length ? cats.map((c) => `
      <div class="admin__prow">
        <img src="${c.image_url ? cldUrl(c.image_url, 80) : '/logo hero.png'}" alt="">
        <div class="admin__prow-main">
          <div class="admin__prow-name">${c.name}</div>
          <div class="admin__prow-sku">/${c.slug}</div>
        </div>
        <div class="admin__prow-actions">
          <button type="button" class="admin__iconAct" data-edit="${c.id}" aria-label="Edit">
            <svg viewBox="0 0 24 24"><path d="M4 16.4 15.4 5l3.6 3.6L7.6 20H4Z"></path></svg>
          </button>
          <button type="button" class="admin__iconAct admin__iconAct--danger" data-del="${c.id}" aria-label="Delete">
            <svg viewBox="0 0 24 24"><path d="M5.6 7.2h12.8l-1 12.4H6.6Z"></path></svg>
          </button>
        </div>
      </div>
    `).join("") : `<p style="color:var(--a-text-dim);padding:20px;text-align:center">No categories yet.</p>`;

    document.querySelectorAll("[data-edit]").forEach((btn) => {
      btn.addEventListener("click", () => openForm(cats.find((c) => c.id === Number(btn.dataset.edit))));
    });
    document.querySelectorAll("[data-del]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this category? Products stay, they just lose this category.")) return;
        await API.del(`/api/categories?id=${btn.dataset.del}`);
        await load();
      });
    });
  }

  function closeForm() { document.getElementById("catModal").style.display = "none"; }

  function openForm(cat) {
    const c = cat || {};
    const isNew = !cat;
    let imageUrl = c.image_url || "";
    let selectedProductIds = new Set(
      isNew ? [] : ALL_PRODUCTS.filter((p) => (p.category_ids || []).includes(c.id)).map((p) => p.id)
    );

    document.getElementById("catModalBody").innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="font-family:var(--serif);font-weight:500;font-size:22px;margin:0">${isNew ? "Add Category" : "Edit Category"}</h2>
        <button type="button" class="admin__iconAct" id="closeCatBtn" aria-label="Close">
          <svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
        </button>
      </div>

      <div class="admin__formSection">
        <h3>Background Image</h3>
        <div id="catImageTile" style="width:100%;aspect-ratio:16/9;background:var(--a-panel-2);position:relative;overflow:hidden;cursor:pointer;border:1px solid var(--a-border)">
          ${imageUrl ? `<img src="${cldUrl(imageUrl, 800)}" alt="" style="width:100%;height:100%;object-fit:cover">` : `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--a-text-dim);font-size:12px"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="1"></rect><circle cx="9" cy="9" r="1.6"></circle><path d="m21 15-5-5-11 11"></path></svg>Click to upload a background photo</div>`}
        </div>
        <input type="file" accept="image/*" id="catImageInput" style="display:none">
        <p class="admin__hint">Shows behind this category's name on the shop page's category tiles and its category header.</p>
      </div>

      <div class="admin__formSection">
        <div class="admin__field"><label>Category Name</label><input id="f_catName" value="${c.name || ""}" placeholder="e.g. Lighting"></div>
      </div>

      <div class="admin__formSection">
        <h3>Products in this Category</h3>
        <input type="text" id="catProductSearch" placeholder="Search products…" style="margin-bottom:10px">
        <div id="catProductList" style="max-height:280px;overflow:auto;border:1px solid var(--a-border)"></div>
        <p class="admin__hint">Check every product that should show up under this category on the storefront.</p>
      </div>

      <div style="display:flex;gap:10px;margin-top:10px">
        <button type="button" class="admin__btn admin__btn--gold" id="saveCatBtn" style="flex:1">Save Category</button>
      </div>
    `;

    function renderProductList(filter) {
      const q = (filter || "").trim().toLowerCase();
      const list = ALL_PRODUCTS.filter((p) => !q || p.name.toLowerCase().includes(q));
      document.getElementById("catProductList").innerHTML = list.length ? list.map((p) => `
        <label style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--a-border);cursor:pointer">
          <input type="checkbox" data-pid="${p.id}" ${selectedProductIds.has(p.id) ? "checked" : ""}>
          <img src="${cldUrl((p.image_urls || [])[0] || '/logo hero.png', 60)}" alt="" style="width:30px;height:30px;object-fit:cover;flex:none;background:var(--a-panel-2)">
          <span style="flex:1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span>
        </label>
      `).join("") : `<p style="color:var(--a-text-dim);padding:16px;text-align:center;font-size:12px">No products found.</p>`;

      document.querySelectorAll("#catProductList [data-pid]").forEach((cb) => {
        cb.addEventListener("change", () => {
          const pid = Number(cb.dataset.pid);
          if (cb.checked) selectedProductIds.add(pid); else selectedProductIds.delete(pid);
        });
      });
    }
    renderProductList("");
    document.getElementById("catProductSearch").addEventListener("input", (e) => renderProductList(e.target.value));

    document.getElementById("catModal").style.display = "block";
    document.getElementById("catModal").scrollTop = 0;
    document.getElementById("closeCatBtn").addEventListener("click", closeForm);

    document.getElementById("catImageTile").addEventListener("click", () => document.getElementById("catImageInput").click());
    document.getElementById("catImageInput").addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      try {
        const { url } = await API.post("/api/upload", { dataUrl });
        imageUrl = url;
        document.getElementById("catImageTile").innerHTML = `<img src="${cldUrl(imageUrl, 800)}" alt="" style="width:100%;height:100%;object-fit:cover">`;
      } catch { alert("Failed to upload image."); }
      e.target.value = "";
    });

    document.getElementById("saveCatBtn").addEventListener("click", async () => {
      const name = document.getElementById("f_catName").value.trim();
      if (!name) { alert("Category name is required."); return; }
      try {
        let catId = c.id;
        if (isNew) {
          await API.post("/api/categories", { name, imageUrl });
          const fresh = await API.get("/api/categories");
          const created = fresh.find((x) => x.name === name);
          catId = created ? created.id : null;
        } else {
          await API.patch(`/api/categories?id=${c.id}`, { name, imageUrl });
        }
        if (catId) {
          await API.patch(`/api/categories?id=${catId}&assign=1`, { productIds: Array.from(selectedProductIds) });
        }
        closeForm();
        await load();
      } catch (err) { alert(err.message || "Failed to save category."); }
    });
  }

  (async () => {
    const session = await AdminShell.init({ active: "categories" });
    if (!session) return;

    try { ALL_PRODUCTS = await API.get("/api/products"); } catch { ALL_PRODUCTS = []; }
    await load();

    document.getElementById("addCatBtn").addEventListener("click", () => openForm(null));
  })();
</script>
</body>
</html>
