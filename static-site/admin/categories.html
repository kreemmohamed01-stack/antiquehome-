<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories — Antique Home Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/admin-v3.css">
</head>
<body>
<div class="admin" id="admin-root">
  <div class="admin__pageHead">
    <div class="admin__pageHead-body">
      <p class="admin__crumb"><a href="/admin/index.html">Dashboard</a><span>Categories</span></p>
      <h1 class="admin__pageTitle">Categories</h1>
      <p class="admin__pageSub">Organize how products are grouped on the storefront.</p>
    </div>
  </div>

  <div class="admin__panel">
    <div class="admin__field2" style="margin-bottom:16px">
      <div class="admin__field"><label>New category name</label><input id="newCatName"></div>
      <div style="display:flex;align-items:flex-end"><button type="button" class="admin__btn admin__btn--gold" id="addCatBtn">Add Category</button></div>
    </div>
    <div id="catList"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin-shell.js"></script>
<script>
  async function load() {
    const cats = await API.get("/api/categories");
    document.getElementById("catList").innerHTML = cats.map((c) => `
      <div class="admin__prow">
        <div class="admin__prow-main"><div class="admin__prow-name">${c.name}</div><div class="admin__prow-sku">/${c.slug}</div></div>
        <button type="button" class="admin__iconAct admin__iconAct--danger" data-del="${c.id}">Delete</button>
      </div>
    `).join("") || `<p style="color:var(--a-text-dim);padding:20px;text-align:center">No categories yet.</p>`;

    document.querySelectorAll("[data-del]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this category?")) return;
        await API.del(`/api/categories?id=${btn.dataset.del}`);
        await load();
      });
    });
  }

  (async () => {
    const session = await AdminShell.init({ active: "categories" });
    if (!session) return;
    await load();

    document.getElementById("addCatBtn").addEventListener("click", async () => {
      const name = document.getElementById("newCatName").value.trim();
      if (!name) return;
      try {
        await API.post("/api/categories", { name });
        document.getElementById("newCatName").value = "";
        await load();
      } catch (err) { alert(err.message || "Failed to add category."); }
    });
  })();
</script>
</body>
</html>
