<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<title>Discounts — Antique Home Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/admin/admin.css">
<link rel="stylesheet" href="/css/admin/admin-v3.css">
<link rel="stylesheet" href="/css/admin/admin-fx.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/admin/admin-luxe.css">
</head>
<body>
<div class="admin" id="admin-root">
  <div class="admin__pageHead">
    <div class="admin__pageHead-body">
      <p class="admin__crumb"><a href="/admin/index.html">Dashboard</a><span>Discounts</span></p>
      <h1 class="admin__pageTitle">Discounts</h1>
      <p class="admin__pageSub">Site-wide sale and coupon codes.</p>
    </div>
  </div>

  <div class="admin__panel" style="margin-bottom:18px">
    <div class="admin__panel-head"><h2 class="admin__panel-title">Site-Wide Sale</h2></div>
    <div class="admin__field">
      <label><input type="checkbox" id="saleActive"> Sale active</label>
    </div>
    <div class="admin__field2">
      <div class="admin__field"><label>Percent off</label><input type="number" id="salePercent" min="0" max="90"></div>
      <div class="admin__field"><label>Label</label><input type="text" id="saleLabel" placeholder="e.g. Autumn Sale"></div>
    </div>
    <button type="button" class="admin__btn admin__btn--gold" id="saveSaleBtn">Save Sale Settings</button>
  </div>

  <div class="admin__panel">
    <div class="admin__panel-head"><h2 class="admin__panel-title">Coupon Codes</h2></div>
    <div class="admin__field2" style="margin-bottom:16px">
      <div class="admin__field"><label>Code</label><input type="text" id="newCode" placeholder="SAVE10"></div>
      <div class="admin__field"><label>Percent Off</label><input type="number" id="newPercent" min="0" max="90"></div>
    </div>
    <button type="button" class="admin__btn admin__btn--gold" id="addCouponBtn" style="margin-bottom:16px">Add Coupon</button>
    <div id="couponList"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin/admin-shell.js"></script>
<script src="/js/admin/pages/discounts.js"></script>
<script src="/js/admin/admin-luxe.js"></script>
</body>
</html>
