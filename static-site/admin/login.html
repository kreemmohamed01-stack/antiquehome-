<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<title>Admin Login — Antique Home</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/admin/admin.css">
<link rel="stylesheet" href="/css/admin/admin-v3.css">
<link rel="stylesheet" href="/css/admin/admin-fx.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/admin/admin-luxe.css">
</head>
<body>
<div class="admin">
  <div class="admin__loginWrap">
    <div class="admin__loginCard">
      <div class="admin__logo">
        <span class="admin__logo-name">ANTIQUE HOME</span>
        <span class="admin__logo-sub">Timeless Living</span>
      </div>
      <h1>Admin Sign In</h1>
      <p>Manage your store, orders and products.</p>
      <form class="admin__form" id="loginForm">
        <div class="admin__loginError" id="loginError" style="display:none"></div>
        <div class="admin__field">
          <label for="email">Username</label>
          <input id="email" type="text" autocomplete="username" required>
        </div>
        <div class="admin__field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="admin__btn admin__btn--gold" id="loginBtn">Sign In</button>
      </form>
    </div>
  </div>
</div>

<script src="/js/admin/pages/login.js"></script>
<script src="/js/admin/admin-luxe.js"></script>
</body>
</html>
