<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.ico?v=2" sizes="any" />
<link rel="icon" href="/favicon-32x32.png?v=2" type="image/png" sizes="32x32" />
<link rel="icon" href="/favicon-16x16.png?v=2" type="image/png" sizes="16x16" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
<link rel="manifest" href="/site.webmanifest" />
<title>Product — Antique Home</title>
<meta name="description" content="Discover timeless antiques and home décor at Antique Home." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://res.cloudinary.com" />
<link rel="preload" as="image" href="/خلفيه منتجات.webp" fetchpriority="high" />
<link rel="preload" as="fetch" href="/api/settings?key=public" crossorigin="anonymous" />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Dancing+Script:wght@500;600;700&display=swap" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet" /></noscript>
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/shop.css" />
<link rel="stylesheet" href="/css/product.css" />
<script src="/js/i18n.js"></script>
<!-- Arabic dictionary: only downloaded for Arabic visitors (js/i18n.js
     fetches it on demand if someone switches language). -->
<meta name="ah-dict" data-src="/js/i18n-dictionary.js" />
<script>try{if(localStorage.getItem("ah_lang")==="ar")document.write('<script src="'+document.querySelector('meta[name=ah-dict]').getAttribute("data-src")+'"><\/script>')}catch(e){}</script>
<script src="/js/seo.js"></script>
</head>
<body>

<div class="promo-bar" role="note">
  <p class="promo-bar__text">
    <span data-i18n-html="promoBar">Delivery Across Egypt<i class="promo-bar__dot" aria-hidden="true"></i>Secure Payments<i class="promo-bar__dot" aria-hidden="true"></i>Quality Guaranteed<i class="promo-bar__dot" aria-hidden="true"></i>Handpicked Timeless Pieces</span>
    <span aria-hidden="true" data-i18n-html="promoBar">Delivery Across Egypt<i class="promo-bar__dot" aria-hidden="true"></i>Secure Payments<i class="promo-bar__dot" aria-hidden="true"></i>Quality Guaranteed<i class="promo-bar__dot" aria-hidden="true"></i>Handpicked Timeless Pieces</span>
  </p>
</div>

<div class="shop-topbar">
  <span class="shop-topbar__right"><span>EGP</span><span>|</span><span>EN</span></span>
</div>

<div class="shop-header">
  <header class="header">
    <a class="brand" href="/" aria-label="Antique Home — Vase &amp; Decor">
      <img class="brand__logo" src="/logo hero.png" alt="Antique Home — Vase &amp; Decor" />
      <span class="brand__shine" aria-hidden="true"></span>
    </a>
    <button class="icon-btn menu-btn" type="button" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="sideMenu" aria-label="Open menu">
      <span class="menu-btn__lines" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="menu-btn__label" data-i18n="menu">Menu</span>
    </button>
    <nav class="header__actions" aria-label="Utilities">
      <button class="icon-btn" type="button" id="searchBtn" aria-haspopup="true" aria-expanded="false" aria-controls="searchDrawer" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"></circle><line x1="15.7" y1="15.7" x2="20.2" y2="20.2"></line></svg>
      </button>
      <button class="icon-btn cart-btn" type="button" id="cartBtn" aria-haspopup="true" aria-expanded="false" aria-controls="cartDrawer" aria-label="Shopping bag">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 7.8h12.8l1 12.4H4.6z"></path><path d="M8.9 9.6V6.6a3.1 3.1 0 0 1 6.2 0v3"></path></svg>
        <span class="cart-btn__count">0</span>
      </button>
      <button class="icon-btn lang-btn" type="button" id="langBtn" aria-label="Switch language">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.4"></circle><path d="M2.6 12h18.8"></path><path d="M12 2.6c2.6 2.6 4 5.9 4 9.4s-1.4 6.8-4 9.4c-2.6-2.6-4-5.9-4-9.4s1.4-6.8 4-9.4Z"></path></svg>
        <span class="lang-btn__label" id="langBtnLabel">العربية</span>
      </button>
    </nav>
  </header>
  <nav class="shop-nav" aria-label="Primary">
    <a href="/" data-i18n="home">Home</a>
    <a href="/shop.html" data-i18n="shop">Shop</a>
    <a href="/#collection" data-i18n="collections">Collections</a>
    <a href="/about.html" data-i18n="aboutUs">About</a>
    <a href="/#contact" data-i18n="contact">Contact</a>
  </nav>
</div>

<div id="pdpSlot">
  <!-- Same background js/product.js renders, shipped in the HTML so it
       paints straight away instead of after the product data loads. -->
  <main class="pdp">
    <div class="pdp__bg" aria-hidden="true"><img src="/خلفيه منتجات.webp" alt="" loading="eager" fetchpriority="high" /></div>
    <div style="position:relative;min-height:70vh;display:flex;align-items:center;justify-content:center">
      <div aria-hidden="true" style="width:34px;height:34px;border-radius:50%;border:2.5px solid rgba(201,162,39,.25);border-top-color:#C9A227;animation:pdpSpin .8s linear infinite"></div>
    </div>
  </main>
</div>

<div id="chromeSlot"></div>

<style>@keyframes pdpSpin { to { transform: rotate(360deg); } }</style>

<script src="/js/api.js"></script>
<script src="/js/chrome-partials.js"></script>
<script src="/js/site-chrome.js"></script>
<script src="/js/product.js"></script>
</body>
</html>
